<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 860" width="1160" height="860" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .group { fill: #f6f6f6; stroke: #c8c8c8; stroke-width: 1; }
      .box { fill: #ffffff; stroke: #333; stroke-width: 1.2; }
      .hub { fill: #ffffff; stroke: #111; stroke-width: 2.2; }
      .tool { fill: #ffffff; stroke: #777; stroke-width: 1; stroke-dasharray: 0; }
      .label { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; fill: #666; }
      .name { font-family: Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #111; }
      .title { font-size: 13px; font-weight: 700; fill: #111; }
      .desc { font-size: 11.5px; fill: #444; }
      .small { font-size: 10.5px; fill: #555; }
      .tag { font-size: 9px; font-weight: 700; letter-spacing: 0.8px; fill: #333; }
      .tagbox { fill: #ececec; stroke: #999; stroke-width: 0.8; }
      .edge { stroke: #333; stroke-width: 1.3; fill: none; }
      .edge-light { stroke: #777; stroke-width: 1.1; fill: none; }
      .loop { stroke: #333; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
      .note { font-size: 10.5px; font-style: italic; fill: #444; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1160" height="860"/>

  <!-- Interfaces -->
  <text class="label" x="20" y="28">INTERFACES</text>
  <rect class="box" x="140" y="40" width="200" height="46" rx="4"/>
  <text class="title" x="240" y="60" text-anchor="middle">Web UI</text>
  <text class="small" x="240" y="76" text-anchor="middle">live step timeline over SSE</text>

  <rect class="box" x="360" y="40" width="240" height="46" rx="4"/>
  <text class="title" x="480" y="60" text-anchor="middle">REST API (FastAPI)</text>
  <text class="small" x="480" y="76" text-anchor="middle">/api/troubleshoot · /stream · /graph</text>

  <rect class="box" x="620" y="40" width="180" height="46" rx="4"/>
  <text class="title" x="710" y="60" text-anchor="middle">CLI</text>
  <text class="small" x="710" y="76" text-anchor="middle">scenarios · ad-hoc queries</text>

  <rect class="box" x="820" y="40" width="200" height="46" rx="4"/>
  <text class="title" x="920" y="60" text-anchor="middle">Evaluation harness</text>
  <text class="small" x="920" y="76" text-anchor="middle">agentic vs. RAG-only baseline</text>

  <path class="edge" d="M340,63 H358" marker-end="url(#arrow)"/>
  <path class="edge" d="M480,86 V128" marker-end="url(#arrow)"/>
  <path class="edge" d="M710,86 V128" marker-end="url(#arrow)"/>
  <path class="edge" d="M920,86 V128" marker-end="url(#arrow)"/>

  <!-- Service -->
  <rect class="box" x="140" y="130" width="880" height="46" rx="4"/>
  <text class="title" x="580" y="150" text-anchor="middle">TroubleshootService</text>
  <text class="small" x="580" y="166" text-anchor="middle">compiles the graph once · streams per-step events · attaches LangSmith run config · lazy LLM client</text>

  <!-- Graph group -->
  <rect class="group" x="20" y="200" width="1120" height="400" rx="6"/>
  <text class="label" x="36" y="222">LANGGRAPH STATE MACHINE</text>
  <text class="small" x="36" y="238">shared GraphState: plan · evidence[D*, C*, E*, G*] · diagnosis · validations · steps</text>

  <path class="edge" d="M580,176 V246" marker-end="url(#arrow)"/>
  <text class="small" x="588" y="200">request</text>

  <!-- triage -->
  <rect class="box" x="470" y="248" width="220" height="52" rx="4"/>
  <text class="name" x="482" y="268">triage</text>
  <rect class="tagbox" x="652" y="256" width="28" height="14" rx="2"/><text class="tag" x="666" y="266" text-anchor="middle">LLM</text>
  <text class="desc" x="482" y="288">parse traceback · plan the investigation</text>

  <path class="edge" d="M580,300 V328" marker-end="url(#arrow)"/>

  <!-- supervisor -->
  <rect class="hub" x="470" y="330" width="220" height="56" rx="4"/>
  <text class="name" x="482" y="351">supervisor</text>
  <rect class="tagbox" x="640" y="338" width="40" height="14" rx="2"/><text class="tag" x="660" y="348" text-anchor="middle">RULES</text>
  <text class="desc" x="482" y="372">routing · escalation · revision budget</text>

  <!-- reporter -->
  <path class="edge" d="M690,358 H858" marker-end="url(#arrow)"/>
  <text class="small" x="700" y="350">done</text>
  <rect class="box" x="860" y="330" width="200" height="56" rx="4"/>
  <text class="name" x="872" y="351">reporter</text>
  <rect class="tagbox" x="1010" y="338" width="40" height="14" rx="2"/><text class="tag" x="1030" y="348" text-anchor="middle">RULES</text>
  <text class="desc" x="872" y="372">report built from state, no LLM</text>
  <path class="edge" d="M1060,358 H1100 V153 H1022" marker-end="url(#arrow)"/>
  <text class="small" x="1106" y="270" transform="rotate(90 1106 270)">Report (JSON + Markdown)</text>

  <!-- dispatch bus -->
  <path class="edge" d="M580,386 V430"/>
  <path class="edge" d="M138,430 H1010"/>
  <path class="edge" d="M138,430 V458" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="edge" d="M356,430 V458" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="edge" d="M574,430 V458" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="edge" d="M792,430 V458" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="edge" d="M1010,430 V458" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="small" x="596" y="412">dispatch ↓ · result returns to supervisor ↑</text>

  <!-- workers -->
  <rect class="box" x="40" y="460" width="196" height="80" rx="4"/>
  <text class="name" x="52" y="480">doc_researcher</text>
  <rect class="tagbox" x="198" y="468" width="28" height="14" rx="2"/><text class="tag" x="212" y="478" text-anchor="middle">LLM</text>
  <text class="desc" x="52" y="500">hybrid retrieval, then</text>
  <text class="desc" x="52" y="516">LLM relevance grading</text>
  <text class="desc" x="52" y="530">→ evidence D*, coverage</text>

  <rect class="box" x="258" y="460" width="196" height="80" rx="4"/>
  <text class="name" x="270" y="480">github_researcher</text>
  <rect class="tagbox" x="414" y="468" width="32" height="14" rx="2"/><text class="tag" x="430" y="478" text-anchor="middle">TOOL</text>
  <text class="desc" x="270" y="500">issue search on the</text>
  <text class="desc" x="270" y="516">error signature</text>
  <text class="desc" x="270" y="530">→ evidence G*, non-fatal</text>

  <rect class="box" x="476" y="460" width="196" height="80" rx="4"/>
  <text class="name" x="488" y="480">code_analyst</text>
  <rect class="tagbox" x="634" y="468" width="28" height="14" rx="2"/><text class="tag" x="648" y="478" text-anchor="middle">LLM</text>
  <text class="desc" x="488" y="500">static analysis and</text>
  <text class="desc" x="488" y="516">reproduction run</text>
  <text class="desc" x="488" y="530">→ evidence C1, C2, E1</text>

  <rect class="box" x="694" y="460" width="196" height="80" rx="4"/>
  <text class="name" x="706" y="480">diagnostician</text>
  <rect class="tagbox" x="852" y="468" width="28" height="14" rx="2"/><text class="tag" x="866" y="478" text-anchor="middle">LLM</text>
  <text class="desc" x="706" y="500">root cause + up to 3 fixes</text>
  <text class="desc" x="706" y="516">full patched code,</text>
  <text class="desc" x="706" y="530">citations to evidence IDs</text>

  <rect class="box" x="912" y="460" width="196" height="80" rx="4"/>
  <text class="name" x="924" y="480">validator</text>
  <rect class="tagbox" x="1058" y="468" width="40" height="14" rx="2"/><text class="tag" x="1078" y="478" text-anchor="middle">RULES</text>
  <text class="desc" x="924" y="500">verified ⇔ original fails</text>
  <text class="desc" x="924" y="516">and patch passes</text>
  <text class="desc" x="924" y="530">+ citation grounding check</text>

  <!-- loops -->
  <path class="loop" d="M190,540 V566 H304 V542" marker-end="url(#arrow)"/>
  <text class="note" x="196" y="584">coverage insufficient → escalate</text>

  <path class="loop" d="M960,540 V566 H842 V542" marker-end="url(#arrow)"/>
  <text class="note" x="790" y="584">no fix passes → revise with stderr (≤ MAX_REVISIONS)</text>

  <!-- Tools group -->
  <rect class="group" x="20" y="620" width="1120" height="140" rx="6"/>
  <text class="label" x="36" y="642">TOOLS AND DATA</text>

  <path class="edge-light" d="M100,540 V658" marker-end="url(#arrow-light)"/>
  <rect class="tool" x="40" y="660" width="196" height="84" rx="4"/>
  <text class="title" x="52" y="680">Hybrid retriever</text>
  <text class="small" x="52" y="698">FAISS dense (bge-small, local)</text>
  <text class="small" x="52" y="713">+ BM25 lexical, fused by RRF</text>
  <text class="small" x="52" y="728">8 docs · 47 header-aware chunks</text>

  <path class="edge-light" d="M400,540 V658" marker-end="url(#arrow-light)"/>
  <rect class="tool" x="258" y="660" width="196" height="84" rx="4"/>
  <text class="title" x="270" y="680">GitHub Search API</text>
  <text class="small" x="270" y="698">issues, matched on title</text>
  <text class="small" x="270" y="713">optional token for rate limit</text>

  <path class="edge-light" d="M530,540 V658" marker-end="url(#arrow-light)"/>
  <rect class="tool" x="476" y="660" width="196" height="84" rx="4"/>
  <text class="title" x="488" y="680">Static analysis</text>
  <text class="small" x="488" y="698">ast parse · pyflakes</text>
  <text class="small" x="488" y="713">imports, functions, undefined names</text>

  <path class="edge-light" d="M640,540 V604 H760 V658" marker-end="url(#arrow-light)"/>
  <path class="edge-light" d="M1060,540 V658" marker-end="url(#arrow-light)"/>
  <rect class="tool" x="694" y="660" width="414" height="84" rx="4"/>
  <text class="title" x="706" y="680">Execution sandbox</text>
  <text class="small" x="706" y="698">subprocess · python -I -S (standard library only) · empty env · temp dir</text>
  <text class="small" x="706" y="713">CPU, memory and file-size limits · wall-clock timeout</text>
  <text class="small" x="706" y="728">used to reproduce the original error and to execute every proposed fix</text>

  <!-- Legend / cross-cutting -->
  <rect class="box" x="20" y="776" width="1120" height="68" rx="4"/>
  <rect class="tagbox" x="36" y="790" width="28" height="14" rx="2"/><text class="tag" x="50" y="800" text-anchor="middle">LLM</text>
  <text class="small" x="72" y="801">structured call via StructuredLLM: strict JSON schema · Groq / xAI / OpenAI · 429 back-off · schema-repair retry</text>
  <rect class="tagbox" x="36" y="812" width="40" height="14" rx="2"/><text class="tag" x="56" y="822" text-anchor="middle">RULES</text>
  <text class="small" x="84" y="823">deterministic code</text>
  <rect class="tagbox" x="196" y="812" width="32" height="14" rx="2"/><text class="tag" x="212" y="822" text-anchor="middle">TOOL</text>
  <text class="small" x="236" y="823">external call, no LLM</text>
  <path class="loop" d="M376,819 H410"/>
  <text class="small" x="418" y="823">feedback path, routed through the supervisor</text>
  <text class="small" x="700" y="823">Observability: every node, LLM call and tool is traced in LangSmith</text>
</svg>
